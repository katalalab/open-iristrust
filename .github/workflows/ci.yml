name: Rust CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          # Windows は 1.99.0 に固定する。Rust 1.100 で cargo のビルド用ディレクトリが一段深くなり、
          # ort-sys 2.0.0-rc.13 の copy-dylibs が DLL のコピー先を見失って build script が panic する。
          # ort を上げたら stable に戻す。ubuntu は stable のまま新しい版を追う。
          toolchain: ${{ matrix.os == 'windows-latest' && '1.99.0' || 'stable' }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - run: cargo build --locked --release
      - run: cargo run --locked --release -- demo --output-dir out/ci-demo
  onnx:
    name: Official model end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - run: sh scripts/fetch-model.sh
      - run: cargo test --locked --test onnx -- --ignored --nocapture
  msrv:
    name: Rust 1.88 core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.88.0
      - run: cargo test --locked --no-default-features
