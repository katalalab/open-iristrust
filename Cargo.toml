[package]
name = "open-iristrust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Rust iris recognition: segmentation, normalization, Gabor encoding and packed-bit matching"
license = "MIT"
repository = "https://github.com/katalalab/open-iristrust"
keywords = ["iris", "biometrics", "computer-vision", "onnx", "recognition"]
categories = ["science", "computer-vision", "command-line-utilities"]
include = ["/src/**", "/tests/**", "/examples/**", "/scripts/**", "/docs/**", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/Cargo.lock"]

[lib]
name = "iristrust"

[[bin]]
name = "iristrust"
path = "src/main.rs"

[features]
default = ["onnx"]
onnx = ["dep:ort"]

[dependencies]
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "pnm"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-27"] }

tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
